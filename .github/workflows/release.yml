name: Build and Release

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.6.0)'
        required: true
        default: 'v0.6.0'

env:
  QT_VERSION: '6.10.1'
  BUILD_TYPE: Release

jobs:
  build-windows:
    runs-on: windows-latest
    # NOT continue-on-error: the installer is the point of this job, so a
    # failure here has to fail the run instead of publishing a release
    # without it.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          modules: 'qtpdf qtshadertools qtcharts qtimageformats qtmultimedia'
          tools: 'tools_mingw1310'

      - name: Configure CMake
        run: |
          cmake -B build -G "MinGW Makefiles" `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}" `
            -DBUILD_TEST=OFF

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      # Already present on windows-latest, but this keeps the job working on
      # any runner image that drops it.
      - name: Ensure Inno Setup is available
        run: choco install innosetup -y --no-progress
        shell: pwsh

      # cpack runs the install rules (which deploy the Qt runtime beside the
      # executable) and then builds both the installer and the portable zip.
      - name: Package installer and portable archive
        run: cpack --config build/CPackConfig.cmake -B build
        shell: pwsh

      # A named .exe is not proof of a working installer, so check that the
      # Qt runtime actually went into it before anything is published.
      - name: Verify the installer and portable archive
        shell: pwsh
        run: |
          $exe = Get-ChildItem build/ResearchManager-*-windows-x64.exe -ErrorAction SilentlyContinue
          $zip = Get-ChildItem build/ResearchManager-*-windows-x64.zip -ErrorAction SilentlyContinue
          if (-not $exe) { throw 'cpack produced no installer' }
          if (-not $zip) { throw 'cpack produced no portable archive' }
          foreach ($f in @($exe[0], $zip[0])) {
            $mb = [math]::Round($f.Length / 1MB, 1)
            Write-Host "$($f.Name) - $mb MB"
            if ($f.Length -lt 10MB) {
              throw "$($f.Name) is only $mb MB - the Qt runtime is missing from it"
            }
          }

      # Install it the way a user would. This is what catches a
      # QT_DEPLOY_BIN_DIR regression, where the executable installs to the
      # root and every Qt DLL one directory below it, so the app cannot start.
      - name: Smoke-test the installer
        shell: pwsh
        run: |
          $exe = (Get-ChildItem build/ResearchManager-*-windows-x64.exe)[0].FullName
          $dir = Join-Path $env:RUNNER_TEMP 'installtest'
          Start-Process -FilePath $exe -Wait -ArgumentList `
            '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir"
          foreach ($need in 'appResearchManager.exe','Qt6Core.dll','Qt6Quick.dll') {
            if (-not (Test-Path (Join-Path $dir $need))) {
              Write-Host "installed tree:"
              Get-ChildItem $dir -Recurse -Depth 1 | Select-Object -First 60 -ExpandProperty FullName
              throw "$need is not beside the installed executable"
            }
          }
          Write-Host 'Installed layout is correct.'
          $uninstaller = Join-Path $dir 'unins000.exe'
          if (Test-Path $uninstaller) {
            Start-Process -FilePath $uninstaller -Wait `
              -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          }

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ResearchManager-Windows-x64
          path: |
            build/ResearchManager-*-windows-x64.exe
            build/ResearchManager-*-windows-x64.zip

  build-macos:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Install Qt for x86_64
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtpdf qtshadertools qtcharts qtimageformats qtmultimedia'
      - name: Configure CMake for x86_64
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}" \
            -DCMAKE_OSX_ARCHITECTURES="x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="10.15" \
            -DBUILD_TEST=OFF
            
      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel
        
      - name: Deploy Qt dependencies (macOS)
        run: |
          cd build
          
          # Verify app bundle exists
          if [ -d "appResearchManager.app" ]; then
            echo "App bundle found"
            
            # Create Resources directory if it doesn't exist
            mkdir -p appResearchManager.app/Contents/Resources
            
            # Function to safely set or add plist values
            set_plist_value() {
              local key=$1
              local type=$2
              local value=$3
              local plist="appResearchManager.app/Contents/Info.plist"
              
              if /usr/libexec/PlistBuddy -c "Print :${key}" "$plist" >/dev/null 2>&1; then
                /usr/libexec/PlistBuddy -c "Set :${key} ${value}" "$plist"
              else
                /usr/libexec/PlistBuddy -c "Add :${key} ${type} ${value}" "$plist"
              fi
            }
            
            # Set Info.plist values
            set_plist_value "CFBundleExecutable" "string" "appResearchManager"
            set_plist_value "CFBundleIdentifier" "string" "com.airlabuno.ResearchManager"
            set_plist_value "CFBundleName" "string" "Research Manager"
            set_plist_value "CFBundleDisplayName" "string" "Research Manager"
            set_plist_value "NSHighResolutionCapable" "bool" "true"
            
            # Set the app icon if available
            if [ -f "${{ github.workspace }}/ResearchManager/images/ResearchManager.icns" ]; then
              cp "${{ github.workspace }}/ResearchManager/images/ResearchManager.icns" appResearchManager.app/Contents/Resources/
              set_plist_value "CFBundleIconFile" "string" "ResearchManager.icns"
              echo "App icon copied successfully"
            else
              echo "Warning: App icon not found"
            fi
            
            # Make executable actually executable
            chmod +x appResearchManager.app/Contents/MacOS/appResearchManager
            
            # Deploy Qt dependencies
            echo "Running macdeployqt..."
            macdeployqt appResearchManager.app -qmldir="${{ github.workspace }}" -dmg -always-overwrite
            
            # Verify the app can launch
            echo "Verifying app bundle structure:"
            ls -la appResearchManager.app/Contents/MacOS/
            echo -e "\nInfo.plist contents:"
            /usr/libexec/PlistBuddy -c "Print" appResearchManager.app/Contents/Info.plist
            
            if [ -f "appResearchManager.dmg" ]; then
              mv appResearchManager.dmg ../ResearchManager-macOS-x64.dmg
              echo "DMG created successfully"
            else
              echo "ERROR: DMG file not created"
              exit 1
            fi
          else
            echo "ERROR: App bundle not created by CMake"
            exit 1
          fi
          
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ResearchManager-macOS-x64
          path: ResearchManager-macOS-x64.dmg

  create-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    # always() lets a macOS failure through, but a release
    # without the Windows installer is not worth publishing.
    if: always() && needs.build-windows.result == 'success' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=v0.6.0" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Research Manager ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/ResearchManager-Windows-x64/*.exe
            artifacts/ResearchManager-Windows-x64/*.zip
            artifacts/ResearchManager-macOS-x64/*.dmg
          body: |
            ## Research Manager ${{ steps.version.outputs.VERSION }}
            
            ### What's New
            
            #### Platform Improvements
            - ✅ **macOS**: Fixed app bundle - now double-clickable from Finder
            - ✅ **All Platforms**: Fixed "Open File" to use default applications
            - ✅ **All Platforms**: Fixed "Copy Path to Clipboard" functionality
            - ✅ **All Platforms**: Fixed "Show in File Manager" to properly reveal files
            
            #### UI/UX Enhancements
            - Improved button spacing and layout in Recent Projects view
            - Better file context menu with platform-specific labels
            - Enhanced file opening with AppleScript on macOS for reliability
            
            #### Build System
            - Updated CMakeLists.txt for better Qt 6.10.1 compatibility
            - Dropped the Qt5Compat dependency; graphical effects now use
              QtQuick.Effects
            - Windows installer built with CPack + Inno Setup, smoke-tested
              in CI before release
            - Fixed macOS Info.plist configuration for proper app launching
            
            ---
            
            ### Downloads
            - **Windows (installer)**: `ResearchManager-*-windows-x64.exe`
            - **Windows (portable)**: `ResearchManager-*-windows-x64.zip`
            - **macOS**: `ResearchManager-macOS-x64.dmg`
            
            ### Installation
            
            #### Windows
            1. Download `ResearchManager-*-windows-x64.exe` and run it.
               It installs for the current user, so no administrator rights are
               needed; pick "all users" in the first dialog to install into
               Program Files instead.
            2. Launch **Research Manager** from the Start menu.

            Prefer no installer? Download `ResearchManager-*-windows-x64.zip`,
            extract it anywhere and run `appResearchManager.exe`.
            
            #### macOS
            1. Download and open `ResearchManager-macOS-x64.dmg`
            2. Drag the app to Applications folder
            3. Double-click to launch (now works properly!)
            
            ### Known Issues
            - None at this time
            
            ### System Requirements
            - **Windows**: Windows 10 or later
            - **macOS**: macOS 10.15 (Catalina) or later
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}